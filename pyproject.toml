[project]
name = "fusionframe"
version = "0.1.0"
description = "A modern async Python web framework combining ideas from FastAPI, Flask, and Django"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Sri Lakshmi Gurram", email = "srilakshmigurram0508@gmail.com" }
]
license = "MIT"
keywords = ["framework", "web", "asgi", "fastapi", "flask", "django"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "uvicorn>=0.20.0",
    "pydantic>=2.0",
    "python-jose>=3.3.0",
    "redis>=5.0.0",
    "click>=8.0",
    "sqlalchemy>=2.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
dev = [
    "pytest>=8.0",
    "black",
    "flake8",
    "build",
    "twine",
]

[project.scripts]
fusionframe = "fusionframe.cli:cli"

[project.urls]
Documentation = "https://github.com/srgurra/fusionframe#readme"
Repository = "https://github.com/srgurra/fusionframe"
Issues = "https://github.com/srgurra/fusionframe/issues"

[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["fusionframe*"]

[tool.black]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
